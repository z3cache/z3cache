name: Bug report
description: Something in z3cache does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If z3cache gave an answer a real Z3 would not (for example a wrong `unsat`), please do **not** open a public issue: report it privately as described in [SECURITY.md](https://github.com/z3cache/z3cache/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `z3cache doctor`
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: z3cache, Verus and Z3 versions, and the operating system.
      placeholder: "z3cache 0.1.0, Verus 0.2026.10.26, Z3 4.16.0, macOS 26"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Relevant lines from `Z3CACHE_LOG`, `z3cache stats` output, or a recording made with `Z3CACHE_RECORD`.
