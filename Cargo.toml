[package]
name = "z3cache"
version = "0.1.2"
edition = "2024"
description = "A drop-in z3 replacement that caches solver answers for Verus, shared across git worktrees"
license = "MIT"
repository = "https://github.com/z3cache/z3cache"
readme = "README.md"
keywords = ["z3", "smt", "verus", "cache", "verification"]
categories = ["development-tools", "caching"]
exclude = [".github/"]

[dependencies]
blake3 = "1"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
toml = { version = "1.2.1", default-features = false, features = ["parse"] }

[lints.rust]
# Set only by Verus, which checks the proofs in src/rlimit/counter.rs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }

[profile.release]
debug = 1
