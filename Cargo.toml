[package]
name = "z3cache"
version = "0.1.0"
edition = "2024"
description = "A drop-in replacement for the z3 binary that caches solver answers"
license = "MIT"
repository = "https://github.com/z3cache/z3cache"
readme = "README.md"
keywords = ["z3", "smt", "verus", "cache", "verification"]
categories = ["development-tools", "caching"]
publish = false

[dependencies]
blake3 = "1"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
toml = { version = "1.2.1", default-features = false, features = ["parse"] }

[profile.release]
debug = 1
